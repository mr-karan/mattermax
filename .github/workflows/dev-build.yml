name: Dev Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/opnlabs/mattermax

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        id: vars
        run: |
          source scripts/lib.sh
          sha="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release=$VERSION-$REVISION-dev.$sha" >> "$GITHUB_OUTPUT"

      - name: Check patches
        run: scripts/check-patches.sh

      - name: Create workspace
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/create-workspace.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: work/src/server/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: work/src/.nvmrc

      - name: Build
        env:
          MATTERMAX_RELEASE: ${{ steps.vars.outputs.release }}
        run: scripts/build-release.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: work/build/dist
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: PACKAGE=mattermax-${{ steps.vars.outputs.release }}-linux-amd64.tar.gz
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ steps.vars.outputs.short_sha }}
